name: Update and deploy

# Rebuilds the duplicate data for every repo in repos.txt once a day and
# publishes site/ to GitHub Pages. Only reads public PR data.

on:
  schedule:
    - cron: "0 5 * * *"   # daily, 05:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch open PRs
        run: python3 fetch.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build site
        run: python3 build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
